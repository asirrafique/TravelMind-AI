services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelmind-app

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: "false"

      # Redis runs inside Docker Compose
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: "true"

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: travelmind-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


volumes:
  redis_data: